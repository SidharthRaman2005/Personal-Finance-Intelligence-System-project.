spring.application.name=backend
# ===============================
# H2 Database Configuration
# ===============================

spring.datasource.url=jdbc:h2:file:./data/financeapp

spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===============================
# JPA Configuration
# ===============================

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ===============================
# H2 Console
# ===============================

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===============================
# Mail Configuration (OTP)
# Fill these with your Google SMTP values
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@example.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Application mail metadata
app.mail.from=your-email@example.com

# ===============================
# JWT Configuration
# ===============================
app.jwt.secret=change-me-to-a-very-long-random-secret-key-at-least-32-characters
app.jwt.expiration-ms=86400000

